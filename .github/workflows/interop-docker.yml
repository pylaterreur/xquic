name: Build interop Docker image

on:
  push:
    branches: [ main, interop, ci-actions-probe ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build:
    # probe only: no repository gate; a local registry stands in for
    # Docker Hub (no credentials on the fork), and the GHCR copy goes
    # to the local registry too.
    permissions:
      packages: write

    runs-on: ubuntu-latest

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
    - uses: actions/checkout@v6
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: network=host
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
          registry: localhost:5000
          username: probe
          password: probe
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and publish interop docker image
      uses: docker/build-push-action@v7
      with:
        context: interop
        push: true
        tags: localhost:5000/probe/xquic-interop:latest

    - name: Push image to GHCR
      run: |
        docker buildx imagetools create \
          --tag localhost:5000/${{ github.repository }}/xquic-interop:latest \
          localhost:5000/probe/xquic-interop:latest

    - name: Inspect the published index
      run: |
        docker buildx imagetools inspect \
          localhost:5000/${{ github.repository }}/xquic-interop:latest
        docker buildx imagetools inspect --raw \
          localhost:5000/${{ github.repository }}/xquic-interop:latest
        docker buildx imagetools inspect --format '{{ json .Provenance }}' \
          localhost:5000/${{ github.repository }}/xquic-interop:latest \
          | jq -c 'paths | map(tostring) | join(".")' | head -n 40
        jq '.auths | keys' ~/.docker/config.json
