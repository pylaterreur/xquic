name: Lint

# Checks the shell scripts with ShellCheck, and the lines that a pull
# request adds for the whitespace rules of CONTRIBUTING.md (no tab, no
# trailing space) and for common misspellings. The line checks look at the
# pull request's own lines only, so the existing code does not have to be
# rewritten first.

on:
  push:
    branches: [ main, 'ci-lint-*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  lint:

    name: Lint

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        # the merge commit of a pull request and its two parents
        fetch-depth: 2
        persist-credentials: false

    - name: Linux Setup
      timeout-minutes: 5
      run: |
        apt_options=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o DPkg::Lock::Timeout=60
        )
        sudo apt-get "${apt_options[@]}" update
        sudo env DEBIAN_FRONTEND=noninteractive \
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            codespell \
            shellcheck

    - name: Check shell scripts
      run: |
        shellcheck --version | sed -n 2p
        # xqc_build.sh, scripts/xquic_test.sh and the MoQ case script keep
        # their shebang below a comment line, so ShellCheck cannot tell
        # their shell; they join once the shebang is their first line.
        git ls-files -z '*.sh' \
          | grep -z -v -x -e xqc_build.sh \
            -e scripts/xquic_test.sh \
            -e scripts/moq_scripts/moq_case_test.sh \
          | xargs -0 shellcheck --severity=error --format=gcc
        # The validation and harness entry points also pass the warnings.
        shellcheck --severity=warning --format=gcc \
          scripts/validate.sh \
          harness/scripts/xqc_harness_check.sh \
          case_test/lib/runner.sh

    - name: Check whitespace in the added lines
      if: github.event_name == 'pull_request'
      run: |
        git -c core.whitespace=trailing-space,space-before-tab,tab-in-indent,blank-at-eof \
          diff --check HEAD^1 HEAD -- \
          '*.c' '*.h' '*.sh' '*.rb' '*.py' '*.yml' '*.yaml' '*.cmake' \
          '*CMakeLists.txt'

    - name: Check spelling in the added lines
      if: github.event_name == 'pull_request'
      run: |
        # file:line of every added line, from the zero-context diff
        git diff -U0 --no-color HEAD^1 HEAD -- . \
          ':(exclude)docs/translation' ':(exclude)docs/docs-zh' \
          | awk '
            /^\+\+\+ / { file = substr($0, 7); next }
            /^@@ / { split($3, range, ","); line = substr(range[1], 2) + 0; next }
            /^\+/ { print file ":" line; line++ }
          ' > "$RUNNER_TEMP/added_lines"
        if [ ! -s "$RUNNER_TEMP/added_lines" ]; then
          echo "no added lines"
          exit 0
        fi
        # TE is an HTTP header and ECT an ECN codepoint.
        cut -d: -f1 "$RUNNER_TEMP/added_lines" | sort -u \
          | xargs -d '\n' codespell --quiet-level=3 \
            --ignore-words-list=te,ect \
          > "$RUNNER_TEMP/spelling" || true
        found=0
        while IFS= read -r hit; do
          if grep -qxF "$(cut -d: -f1,2 <<< "$hit")" "$RUNNER_TEMP/added_lines"; then
            echo "$hit"
            found=1
          fi
        done < "$RUNNER_TEMP/spelling"
        exit "$found"
