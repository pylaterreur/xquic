name: Platforms

# Runs the CUnit suite on the architectures and systems that the Build
# workflow does not test: 64-bit ARM natively, with the client-to-server
# cases as well; 32-bit x86; macOS on Apple silicon and on Intel; and,
# under QEMU user emulation, 32-bit ARM, 64-bit RISC-V and big-endian
# s390x. BoringSSL supports little-endian targets only, so s390x links
# Tongsuo (BabaSSL) instead.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XQC_FEATURE_FLAGS: >-
    -DXQC_ENABLE_TESTING=1
    -DXQC_PRINT_SECRET=1
    -DXQC_ENABLE_EVENT_LOG=1
    -DXQC_ENABLE_BBR2=1
    -DXQC_ENABLE_RENO=1
    -DXQC_ENABLE_UNLIMITED=1
    -DXQC_ENABLE_COPA=1
    -DXQC_COMPAT_DUPLICATE=1
    -DXQC_ENABLE_FEC=1
    -DXQC_ENABLE_XOR=1
    -DXQC_ENABLE_RSC=1
    -DXQC_ENABLE_PKM=1
    -DXQC_ENABLE_WEBTRANSPORT=1

jobs:

  linux:

    name: Linux ${{ matrix.arch }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: arm64, os: ubuntu-24.04-arm, cases: true }
        - { arch: i386, os: ubuntu-24.04, cases: true }

    env:
      XQC_ARCH: ${{ matrix.arch }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Linux Setup
      timeout-minutes: 5
      run: |
        apt_options=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o DPkg::Lock::Timeout=60
        )
        packages=(build-essential libcunit1-dev libevent-dev lsof psmisc)
        if [ "$XQC_ARCH" = i386 ]; then
          sudo dpkg --add-architecture i386
          packages=(gcc-multilib g++-multilib libcunit1-dev:i386 libevent-dev:i386 lsof psmisc)
        fi
        sudo apt-get "${apt_options[@]}" update
        sudo env DEBIAN_FRONTEND=noninteractive \
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            "${packages[@]}"

    - name: Build BoringSSL
      run: |
        git clone --depth 1 https://github.com/google/boringssl.git ./third_party/boringssl
        toolchain=()
        if [ "$XQC_ARCH" = i386 ]; then
          toolchain=(-DCMAKE_TOOLCHAIN_FILE=util/32-bit-toolchain.cmake)
        fi
        cmake -S third_party/boringssl -B third_party/boringssl/build \
          "${toolchain[@]}" \
          -DBUILD_SHARED_LIBS=0 -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC"
        cmake --build third_party/boringssl/build --parallel --target ssl crypto

    - name: Build XQUIC
      run: |
        arch_flags=()
        if [ "$XQC_ARCH" = i386 ]; then
          arch_flags=(-DCMAKE_C_FLAGS=-m32 -DCMAKE_LIBRARY_ARCHITECTURE=i386-linux-gnu)
        fi
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        # shellcheck disable=SC2086
        cmake -S . -B build \
          "${arch_flags[@]}" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DXQC_SUPPORT_SENDMMSG_BUILD=1 \
          ${XQC_FEATURE_FLAGS} \
          -DSSL_TYPE=boringssl \
          -DSSL_PATH="${SSL_PATH_STR}" \
          -DSSL_INC_PATH="${SSL_PATH_STR}/include" \
          -DSSL_LIB_PATH="${SSL_PATH_STR}/build/libssl.a;${SSL_PATH_STR}/build/libcrypto.a"
        cmake --build build --parallel
        file build/tests/run_tests

    - name: Test
      run: |
        cd build
        openssl req -newkey rsa:2048 -x509 -nodes \
          -keyout server.key \
          -new \
          -out server.crt \
          -subj /CN=test.xquic.com
        ./tests/run_tests 2>&1 | tee ../xquic_platform_unit.log
        unit_summary=$(awk '
          $1 == "tests" && NF == 6 && $2 ~ /^[0-9]+$/ \
            && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+$/ && $5 ~ /^[0-9]+$/ {
            summary = $2 " " $3 " " $4 " " $5
          }
          END {print summary}
        ' ../xquic_platform_unit.log)
        read -r unit_total unit_ran unit_passed unit_failed \
          <<< "${unit_summary:-0 0 0 1}"
        echo "unit test total:$unit_total ran:$unit_ran" \
          "passed:$unit_passed failed:$unit_failed"
        unit_result=0
        if [ "$unit_total" -eq 0 ] \
          || [ "$unit_ran" -ne "$unit_total" ] \
          || [ "$unit_passed" -ne "$unit_total" ] \
          || [ "$unit_failed" -ne 0 ]; then
          unit_result=1
        fi

        case_result=0
        if [ "${{ matrix.cases }}" = true ]; then
          case_plan="$(bash ../scripts/case_test.sh --execution-plan)"
          expected="$(printf '%s\n' "$case_plan" | awk -F= '/^implemented_unique_cases=/{print $2}')"
          set +e
          XQC_BUILD_DIR="${PWD}" \
            CASE_TEST_CASE_TIMEOUT=300 \
            CASE_TEST_SHARD_TIMEOUT=600 \
            bash ../scripts/case_test.sh --execute --parallel --jobs auto --require-complete \
            2>&1 | tee ../xquic_platform_case_test.log
          case_status=${PIPESTATUS[0]}
          set -e
          case_passed=$(awk '/^\[case-test:[^]]+\] .+ >>>>>>>> pass:1$/ {count++} END {print count + 0}' ../xquic_platform_case_test.log)
          case_failed=$(awk '/^\[case-test:[^]]+\] .+ >>>>>>>> pass:0$/ {count++} END {print count + 0}' ../xquic_platform_case_test.log)
          echo "case test passed:$case_passed failed:$case_failed expected:$expected status:$case_status"
          grep -E '^\[case-test:[^]]+\] .+ >>>>>>>> pass:0$' ../xquic_platform_case_test.log || true
          if [ "$case_status" -ne 0 ] || [ "$case_failed" -ne 0 ] \
            || [ "$case_passed" -ne "${expected:-0}" ]; then
            case_result=1
          fi
        fi

        if [ "$unit_result" -eq 0 ] && [ "$case_result" -eq 0 ]; then
          echo "===== All tests passed! ====="
        else
          echo "===== Test failed! ====="
          exit 1
        fi

    - name: Upload case-test logs
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: platforms-${{ matrix.arch }}-logs
        path: |
          xquic_platform_unit.log
          xquic_platform_case_test.log
          build/case_test_parallel/*/*/case_test.log
          build/case_test_parallel/*/*/case_test.failures
          build/case_test_parallel/*/*/case-output-*.log
        retention-days: 3

  macos:

    name: macOS ${{ matrix.arch }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: arm64, os: macos-15 }
        - { arch: x86_64, os: macos-15-intel }

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: macOS Setup
      run: |
        brew install cunit libevent

    - name: Build BoringSSL
      run: |
        git clone --depth 1 https://github.com/google/boringssl.git ./third_party/boringssl
        cmake -S third_party/boringssl -B third_party/boringssl/build \
          -DBUILD_SHARED_LIBS=0 -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC"
        cmake --build third_party/boringssl/build --parallel --target ssl crypto

    - name: Build XQUIC
      run: |
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        # shellcheck disable=SC2086
        cmake -S . -B build \
          -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
          -DPLATFORM=mac \
          -DCMAKE_BUILD_TYPE=Debug \
          -DXQC_SUPPORT_SENDMMSG_BUILD=0 \
          ${XQC_FEATURE_FLAGS} \
          -DSSL_TYPE=boringssl \
          -DSSL_PATH="${SSL_PATH_STR}" \
          -DSSL_INC_PATH="${SSL_PATH_STR}/include" \
          -DSSL_LIB_PATH="${SSL_PATH_STR}/build/libssl.a;${SSL_PATH_STR}/build/libcrypto.a"
        cmake --build build --parallel

    - name: Test
      run: |
        cd build
        openssl req -newkey rsa:2048 -x509 -nodes \
          -keyout server.key \
          -new \
          -out server.crt \
          -subj /CN=test.xquic.com
        ./tests/run_tests 2>&1 | tee ../xquic_platform_unit.log
        unit_summary=$(awk '
          $1 == "tests" && NF == 6 && $2 ~ /^[0-9]+$/ \
            && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+$/ && $5 ~ /^[0-9]+$/ {
            summary = $2 " " $3 " " $4 " " $5
          }
          END {print summary}
        ' ../xquic_platform_unit.log)
        read -r unit_total unit_ran unit_passed unit_failed \
          <<< "${unit_summary:-0 0 0 1}"
        echo "unit test total:$unit_total ran:$unit_ran" \
          "passed:$unit_passed failed:$unit_failed"
        if [ "$unit_total" -gt 0 ] \
          && [ "$unit_ran" -eq "$unit_total" ] \
          && [ "$unit_passed" -eq "$unit_total" ] \
          && [ "$unit_failed" -eq 0 ]; then
          echo "===== All unit tests passed! ====="
        else
          echo "===== Unit test failed! ====="
          exit 1
        fi

  emulated:

    name: Linux ${{ matrix.arch }} under QEMU

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: armhf, triplet: arm-linux-gnueabihf, processor: armv7-a, ssl: boringssl }
        - { arch: riscv64, triplet: riscv64-linux-gnu, processor: riscv64, ssl: boringssl }
        - { arch: s390x, triplet: s390x-linux-gnu, processor: s390x, ssl: babassl }

    env:
      XQC_ARCH: ${{ matrix.arch }}
      XQC_TRIPLET: ${{ matrix.triplet }}
      XQC_PROCESSOR: ${{ matrix.processor }}
      XQC_SSL: ${{ matrix.ssl }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Linux Setup
      timeout-minutes: 8
      run: |
        apt_options=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o DPkg::Lock::Timeout=60
        )
        # The foreign architecture comes from the ports archive; keep the
        # runner's own sources to the host architectures.
        sudo dpkg --add-architecture "$XQC_ARCH"
        sudo sed -i '/^Types: deb$/a Architectures: amd64 i386' \
          /etc/apt/sources.list.d/ubuntu.sources
        printf '%s\n' \
          'Types: deb' \
          'URIs: http://ports.ubuntu.com/ubuntu-ports' \
          'Suites: noble noble-updates noble-security' \
          'Components: main universe' \
          "Architectures: $XQC_ARCH" \
          'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
          | sudo tee /etc/apt/sources.list.d/ports.sources > /dev/null
        sudo apt-get "${apt_options[@]}" update
        sudo env DEBIAN_FRONTEND=noninteractive \
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            "gcc-$XQC_TRIPLET" \
            "g++-$XQC_TRIPLET" \
            qemu-user-static \
            "libcunit1-dev:$XQC_ARCH" \
            "libevent-dev:$XQC_ARCH"

    - name: Build BoringSSL
      if: matrix.ssl == 'boringssl'
      run: |
        git clone --depth 1 https://github.com/google/boringssl.git ./third_party/boringssl
        cmake -S third_party/boringssl -B third_party/boringssl/build \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR="$XQC_PROCESSOR" \
          -DCMAKE_C_COMPILER="$XQC_TRIPLET-gcc" \
          -DCMAKE_CXX_COMPILER="$XQC_TRIPLET-g++" \
          -DBUILD_SHARED_LIBS=0 -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC"
        cmake --build third_party/boringssl/build --parallel --target ssl crypto
        echo "SSL_INC=${PWD}/third_party/boringssl/include" >> "$GITHUB_ENV"
        echo "SSL_LIBS=${PWD}/third_party/boringssl/build/libssl.a;${PWD}/third_party/boringssl/build/libcrypto.a" >> "$GITHUB_ENV"

    - name: Build Tongsuo
      if: matrix.ssl == 'babassl'
      run: |
        git clone --branch 8.3-stable --depth 1 \
          https://github.com/Tongsuo-Project/Tongsuo.git \
          ./third_party/babassl
        cd ./third_party/babassl
        ./Configure "linux64-$XQC_PROCESSOR" \
          --cross-compile-prefix="$XQC_TRIPLET-" \
          no-shared no-tests no-asm
        make -j"$(nproc)" build_libs > /dev/null
        echo "SSL_INC=${PWD}/include" >> "$GITHUB_ENV"
        echo "SSL_LIBS=${PWD}/libssl.a;${PWD}/libcrypto.a" >> "$GITHUB_ENV"

    - name: Build XQUIC
      run: |
        # shellcheck disable=SC2086
        cmake -S . -B build \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR="$XQC_PROCESSOR" \
          -DCMAKE_C_COMPILER="$XQC_TRIPLET-gcc" \
          -DCMAKE_LIBRARY_ARCHITECTURE="$XQC_TRIPLET" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DXQC_SUPPORT_SENDMMSG_BUILD=1 \
          ${XQC_FEATURE_FLAGS} \
          -DSSL_TYPE="$XQC_SSL" \
          -DSSL_PATH="${PWD}/third_party/$XQC_SSL" \
          -DSSL_INC_PATH="$SSL_INC" \
          -DSSL_LIB_PATH="$SSL_LIBS"
        cmake --build build --parallel
        file build/tests/run_tests

    - name: Test
      run: |
        cd build
        openssl req -newkey rsa:2048 -x509 -nodes \
          -keyout server.key \
          -new \
          -out server.crt \
          -subj /CN=test.xquic.com
        ./tests/run_tests 2>&1 | tee ../xquic_emulated_unit.log
        unit_summary=$(awk '
          $1 == "tests" && NF == 6 && $2 ~ /^[0-9]+$/ \
            && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+$/ && $5 ~ /^[0-9]+$/ {
            summary = $2 " " $3 " " $4 " " $5
          }
          END {print summary}
        ' ../xquic_emulated_unit.log)
        read -r unit_total unit_ran unit_passed unit_failed \
          <<< "${unit_summary:-0 0 0 1}"
        echo "unit test total:$unit_total ran:$unit_ran" \
          "passed:$unit_passed failed:$unit_failed"
        grep -E 'FAILED|Suite .* Test .* had failures' ../xquic_emulated_unit.log | head -50 || true
        if [ "$unit_total" -gt 0 ] \
          && [ "$unit_ran" -eq "$unit_total" ] \
          && [ "$unit_passed" -eq "$unit_total" ] \
          && [ "$unit_failed" -eq 0 ]; then
          echo "===== All unit tests passed! ====="
        else
          echo "===== Unit test failed! ====="
          exit 1
        fi
