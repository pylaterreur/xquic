name: Publish XQUIC WebTransport image

on:
  push:
    branches: [main, ci-actions-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xquic-webtransport-image
  cancel-in-progress: false

# probe only: publish to a local registry instead of ghcr.io/alibaba.
env:
  IMAGE_NAME: localhost:5000/probe/xquic-webtransport-interop

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and test the amd64 endpoint
        run: |
          docker buildx build --load --platform linux/amd64 \
            --build-arg "IMAGE_SOURCE=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "XQUIC_REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            -f interop/webtransport/Dockerfile .

      - name: Sign in to the GitHub Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the commit tag and latest alias
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "$image"
          docker tag "$image" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          {
            echo "XQUIC revision: ${GITHUB_SHA}"
            echo "Commit tag: ${image}"
            echo "Image digest: ${digest}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show the registry logins (probe only)
        run: jq '.auths | keys' ~/.docker/config.json
